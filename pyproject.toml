[project]
name = "expense-tracker"
version = "0.1.0"
description = "A conversational AI agent for tracking daily expenses and monthly spending by category"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.111.0",
    "google-adk[extensions]>=1.0.0",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
    "google-adk[eval]>=1.0.0",
    "nest-asyncio>=1.6.0",
]

lint = [
    "ruff>=0.4.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["expense_tracker"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
expense-web = "expense_tracker.web_ui:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.agent-starter-pack]
example_question = "I spent €45 on groceries today"

[tool.agent-starter-pack.settings]
agent_directory = "expense_tracker"
